<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirect Choice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111827;
            color: white;
            text-align: center;
            padding-top: 100px;
        }
        .link-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .box-link {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 8px;
        }
        .yt { background-color: #ef4444; }
        .gg { background-color: #3b82f6; }
    </style>
</head>
<body>

    <h1>Where would you like to go?</h1>
    
    <div class="link-container">
        <!-- target="_blank" forces the link to open in a safe new browser tab -->
        <a class="box-link yt" href="https://youtu.be/dJLw1DjaEBM?si=Jcf8F9SvMRRnlhad" target="_blank">YouTube</a>
        <a class="box-link gg" href="https://youtu.be/dJLw1DjaEBM?si=Jcf8F9SvMRRnlhad" target="_blank">Google</a>
    </div>

</body>
</html>
